/* ---------- Dates ---------- */
function pad(n){return String(n).padStart(2,'0');}
function dk(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(k){var a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function today(){return dk(new Date());}
function addDays(k,n){var d=parse(k);d.setDate(d.getDate()+n);return dk(d);}
function diff(a,b){return Math.round((parse(b)-parse(a))/864e5);}
function fmt(k){return parse(k).toLocaleDateString('en-IN',{day:'numeric',month:'short'});}
function dow(k){return parse(k).toLocaleDateString('en-IN',{weekday:'narrow'});}
function lastN(n){var o=[],t=today();for(var i=n-1;i>=0;i--)o.push(addDays(t,-i));return o;}
function day(k){if(!S.days[k])S.days[k]={};return S.days[k];}
function dj(j,k){var d=day(k||today());if(!d[j])d[j]={};return d[j];}
function peek(j,k){var d=S.days[k];return d&&d[j]?d[j]:null;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function avg(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:0;}
function has(j){return S.journeys.indexOf(j)>-1;}

/* ---------- Rewards ---------- */
function level(){var i=0;LEVELS.forEach(function(l,x){if(S.xp>=l[0])i=x;});var nx=LEVELS[i+1];return{i:i,name:LEVELS[i][1],next:nx?nx[0]:null,from:LEVELS[i][0],nextName:nx?nx[1]:''};}
function touchStreak(){
  var t=today(),s=S.streak;if(s.last===t)return;
  if(!s.last){s.n=1;}else{var g=diff(s.last,t);
    if(g===1)s.n++;else if(g===2&&s.freeze>0){s.freeze--;s.n++;toast('Rest day covered by a streak freeze');}else s.n=1;}
  s.last=t;if(s.n%7===0)s.freeze=Math.min(2,s.freeze+1);
}
function award(j,key,why,xp){
  var k=today()+'|'+key;if(S.awarded[k])return false;
  S.awarded[k]=1;var before=level().i;
  S.tiles.push({j:j,t:Date.now(),w:why});popIdx=S.tiles.length-1;S.xp+=(xp||10);
  touchStreak();var nb=checkBadges();var after=level();
  var m='+1 tile';if(after.i>before)m='Level up: '+after.name+'. A new treat card is unlocked';else if(nb)m='Badge unlocked: '+nb;
  toast(m);save();return true;
}
function countDays(fn){var n=0;Object.keys(S.days).forEach(function(k){if(fn(S.days[k]))n++;});return n;}
function countRit(){var n=0;Object.keys(S.days).forEach(function(k){n+=(S.days[k].rit||[]).length;});return n;}
function badgeTest(id){
  switch(id){
    case 'first':return S.tiles.length>=1;
    case 'streak3':return S.streak.n>=3;
    case 'streak7':return S.streak.n>=7;
    case 'tiles10':return S.tiles.length>=10;
    case 'board':return S.tiles.length>=36;
    case 'cycle3':return S.periods.length>=3;
    case 'water':return countDays(function(d){return (d.water||0)>=6;})>=3;
    case 'sleep':return countDays(function(d){return (d.sleep||0)>=7;})>=3;
    case 'rit5':return countRit()>=5;
    case 'scalp':return countDays(function(d){return d.hair&&d.hair.saved;})>=3;
    case 'rainbow':return countDays(function(d){return d.kids&&(d.kids.rb||[]).length>=5;})>=1;
    case 'brave':return countDays(function(d){return d.kids&&d.kids.tried;})>=3;
  }return false;
}
function checkBadges(){
  var last='';BADGES.forEach(function(b){if(!S.badges[b[0]]&&badgeTest(b[0])){S.badges[b[0]]=Date.now();last=b[2];}});return last;
}

/* ---------- Cycle maths ---------- */
function cycleInfo(){
  var p=S.periods.slice().sort(),t=today(),lens=[];
  for(var i=1;i<p.length;i++)lens.push(diff(p[i-1],p[i]));
  var rec=lens.slice(-4),a=rec.length?Math.round(avg(rec)):28;
  var irr=lens.length>=2&&(Math.max.apply(null,lens)-Math.min.apply(null,lens)>7||Math.max.apply(null,lens)>35);
  if(!p.length)return{has:false,avg:a,irr:irr,lens:lens};
  var last=p[p.length-1],d=diff(last,t)+1,next=addDays(last,a),toNext=diff(t,next),ov=a-14,ph;
  if(d<1)ph='luteal';else if(d<=S.periodLen)ph='menstrual';else if(d<ov-1)ph='follicular';else if(d<=ov+1)ph='ovulatory';else ph='luteal';
  return{has:true,last:last,day:d,avg:a,next:next,toNext:toNext,phase:ph,irr:irr,lens:lens};
}

/* ---------- Personalised rituals ---------- */
function pushUniq(arr,r){if(r&&!arr.some(function(x){return x.id===r.id;}))arr.push(r);}
function ritualsFor(j){
  var out=[],t=today(),r=peek(j,t)||{};
  if(j==='cycle'){
    (r.symptoms||[]).slice(0,2).forEach(function(s){pushUniq(out,SYM_R[s]);});
    if(r.mood&&r.mood<=2)pushUniq(out,SYM_R.mood);
    var ci=cycleInfo(),ph=ci.has?ci.phase:'follicular';
    PHASE_R[ph].forEach(function(x){pushUniq(out,x);});
  }else if(j==='hair'){
    if(r.shed==='lots')pushUniq(out,HAIR_R.lots);
    (r.scalp||[]).forEach(function(s){pushUniq(out,HAIR_R[s]);});
    pushUniq(out,HAIR_R.base1);pushUniq(out,HAIR_R.base2);
  }else if(j==='energy'){
    var sl=day(t).sleep;
    if(sl&&sl<7)pushUniq(out,ENERGY_R.lowsleep);
    if((r.caffeine||0)>=3)pushUniq(out,ENERGY_R.caffeine);
    if(r.stress==='high')pushUniq(out,ENERGY_R.stress);
    if(r.energy&&r.energy<=2)pushUniq(out,ENERGY_R.low);
    ['food','walk','stress','caffeine','low','lowsleep'].forEach(function(k){pushUniq(out,ENERGY_R[k]);});
  }else if(j==='kids'){
    if(r.appetite==='refused')pushUniq(out,KIDS_R.refused);
    if((r.rb||[]).length<3)pushUniq(out,KIDS_R.rainbow);
    if(r.play==='none')pushUniq(out,KIDS_R.play);
    ['story','cook','snack','refused','play','rainbow'].forEach(function(k){pushUniq(out,KIDS_R[k]);});
  }
  return out.slice(0,5);
}
function ritDone(id){return (day(today()).rit||[]).indexOf(id)>-1;}
function doRitual(j,id){
  var d=day(today());d.rit=d.rit||[];if(d.rit.indexOf(id)>-1)return;
  d.rit.push(id);if(!award(j,'rit-'+id,'ritual',12)){save();}
  allQuestsBonus();
}

function quests(){

/* ---------- Insights ---------- */
function symCounts(n){
  var c={};lastN(n).forEach(function(k){var r=peek('cycle',k);if(r&&r.symptoms)r.symptoms.forEach(function(s){c[s]=(c[s]||0)+1;});});
  return Object.keys(c).map(function(k){return[k,c[k]];}).sort(function(a,b){return b[1]-a[1];});
}
function sleepLink(){
  var lo=[],hi=[];
  Object.keys(S.days).forEach(function(k){var d=S.days[k];if(d.cycle&&d.cycle.saved&&d.sleep){var n=(d.cycle.symptoms||[]).length;(d.sleep<7?lo:hi).push(n);}});
  if(lo.length>=2&&hi.length>=2){var a=avg(lo),b=avg(hi);if(a-b>=0.5)return 'On days you slept under 7 hours you logged '+a.toFixed(1)+' symptoms on average, against '+b.toFixed(1)+' after 7 hours or more.';}
  return '';
}
function energyLink(){
  var lo=[],hi=[];
  Object.keys(S.days).forEach(function(k){var d=S.days[k];if(d.energy&&d.energy.saved&&d.sleep&&d.energy.energy){(d.sleep<7?lo:hi).push(d.energy.energy);}});
  if(lo.length>=2&&hi.length>=2){var a=avg(lo),b=avg(hi);if(b-a>=0.4)return 'Your energy averages '+b.toFixed(1)+' out of 5 after 7+ hours of sleep, against '+a.toFixed(1)+' after less.';}
  return '';
}
function shedLevel(v){return v==='lots'?3:v==='some'?2:v==='few'?1:0;}

/* ---------- Care summary (for a doctor or expert) ---------- */
function summary(){
  var L=['TESSERA CARE SUMMARY','Name: '+(S.name||'Not set'),'Created: '+fmt(today()),''];
  if(has('cycle')){
    var ci=cycleInfo();L.push('CYCLE');
    if(ci.has){L.push('Last period started: '+fmt(ci.last)+'. Period length about '+S.periodLen+' days.');
      L.push('Average cycle: '+ci.avg+' days'+(ci.lens.length?' (range '+Math.min.apply(null,ci.lens)+' to '+Math.max.apply(null,ci.lens)+' days across '+ci.lens.length+' cycles)':'')+'.');
      if(ci.irr)L.push('Cycle length varies a lot. Worth discussing irregular cycles.');}
    else L.push('No period dates logged yet.');
    var sc=symCounts(30).slice(0,4);if(sc.length)L.push('Most logged symptoms (30 days): '+sc.map(function(x){return SYMN[x[0]]+' ('+x[1]+' days)';}).join(', ')+'.');
    var sl=sleepLink();if(sl)L.push(sl);L.push('');
  }
  if(has('hair')){
    var hs=lastN(30).map(function(k){return peek('hair',k);}).filter(function(r){return r&&r.shed;});
    L.push('HAIR AND SCALP');
    if(hs.length){var lots=hs.filter(function(r){return r.shed==='lots';}).length;L.push('Heavy shedding on '+lots+' of '+hs.length+' logged days in the last 30 days.');}
    else L.push('No hair check-ins yet.');L.push('');
  }
  if(has('energy')){
    var es=lastN(30).map(function(k){return peek('energy',k);}).filter(function(r){return r&&r.energy;});
    L.push('ENERGY AND STRESS');
    if(es.length)L.push('Average energy '+avg(es.map(function(r){return r.energy;})).toFixed(1)+' out of 5 over '+es.length+' days.');else L.push('No energy check-ins yet.');
    var el=energyLink();if(el)L.push(el);L.push('');
  }
  if(has('kids')){
    var ks=lastN(14).map(function(k){return peek('kids',k);}).filter(function(r){return r&&r.saved;});
    L.push('CHILD: '+(S.kid.name||'Child')+', age '+S.kid.age);
    if(ks.length){L.push('Ate well on '+ks.filter(function(r){return r.appetite==='well';}).length+' of '+ks.length+' logged days. Average rainbow colours per day: '+avg(ks.map(function(r){return (r.rb||[]).length;})).toFixed(1)+' of 5.');}
    else L.push('No daily logs yet.');L.push('');
  }
  var bs=lastN(14).map(function(k){return S.days[k];}).filter(function(d){return d&&d.sleep;});
  if(bs.length)L.push('Average sleep (14 days): '+avg(bs.map(function(d){return d.sleep;})).toFixed(1)+' hours.');
  L.push('This is self-reported wellness tracking, not a diagnosis.');
  return L.join('\n');
}

/* ---------- Events ---------- */
function num(v){return /^-?\d+$/.test(v)?Number(v):v;}
function act(a,el){
  var v=el.dataset.v,j=el.dataset.j,f=el.dataset.f,r;
  switch(a){
    case 'tab':V.tab=v;V.j=null;V.confirm=false;render(true);return;
    case 'open':if(!has(j=v)){S.journeys.push(v);save();}V.tab='journeys';V.j=v;V.sub='log';render(true);return;
    case 'back':V.j=null;render(true);return;
    case 'sub':V.sub=v;render(true);return;
    case 'set':dj(j)[f]=num(v);save();render();return;
    case 'tog':r=dj(j);r[f]=r[f]||[];var ix=r[f].indexOf(v);if(ix>-1)r[f].splice(ix,1);else r[f].push(v);
      if(f==='rb'&&r[f].length===5)toast('Rainbow complete! Five stickers');save();render();return;
    case 'flag':r=dj(j);r[f]=!r[f];save();render();return;
    case 'cup':r=dj('energy');r.caffeine=Math.max(0,Math.min(9,(r.caffeine||0)+Number(v)));save();render();return;
    case 'plen':S.periodLen=Math.max(2,Math.min(10,S.periodLen+Number(v)));save();render();return;
    case 'period':
      var pd=document.getElementById('pdate'),dt=(pd&&pd.value)||today();
      if(dt>today()){toast('Pick today or an earlier date');return;}
      if(S.periods.indexOf(dt)<0)S.periods.push(dt);S.periods.sort();
      award('cycle','period-'+dt,'period',15);toast('Period start saved for '+fmt(dt));save();render();return;
    case 'undoPeriod':S.periods.sort();S.periods.pop();save();toast('Last date removed');render();return;
    case 'save':
      dj(j).saved=true;var got=award(j,'log','checkin',10);if(!got)toast('Check-in updated');
      allQuestsBonus();V.sub='care';save();render(true);return;
    case 'rit':doRitual(j,v);render();return;
    case 'say':
      try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(el.dataset.t);u.rate=.95;window.speechSynthesis.speak(u);}catch(e){toast('Listening is not available here');}
      return;
    case 'water':
      r=day(today());var n=Number(v);r.water=(r.water===n)?n-1:n;
      if(r.water>=6)award(S.journeys[0]||'cycle','water6','water',8);allQuestsBonus();save();render();return;
    case 'sleep':
      r=day(today());var cur=r.sleep==null?7:r.sleep;r.sleep=Math.max(3,Math.min(12,cur+Number(v)));
      if(r.sleep>=7)award(S.journeys[0]||'cycle','sleep7','sleep',8);save();render();return;
    case 'quest':
      var q=quests()[Number(v)];if(!q)return;
      if(q.go==='journey'){V.tab='journeys';V.j=q.j;V.sub='log';render(true);}
      else if(q.go==='care'){V.tab='journeys';V.j=S.journeys[0];V.sub='care';render(true);}
      else{var b=document.getElementById('basics');if(b)b.scrollIntoView({behavior:'smooth',block:'center'});}
      return;
    case 'dismiss':S.hintDone=true;save();render();return;
    case 'size':S.size=Number(v);save();render();return;
    case 'jtog':
      if(has(v)){if(S.journeys.length>1)S.journeys.splice(S.journeys.indexOf(v),1);else toast('Keep at least one journey');}
      else S.journeys.push(v);
      S.journeys.sort(function(a,b){return JIDS.indexOf(a)-JIDS.indexOf(b);});save();render();return;
    case 'copy':
      var ta=document.getElementById('sum');
      try{navigator.clipboard.writeText(ta.value).then(function(){toast('Summary copied');},function(){ta.select();toast('Press and hold to copy');});}
      catch(e){ta.select();toast('Press and hold to copy');}
      return;
    case 'demo':seedDemo();V.tab='today';V.j=null;V.ob=0;toast('Demo profile loaded');render(true);return;
    case 'reset-ask':V.confirm=true;render();return;
    case 'reset-no':V.confirm=false;render();return;
    case 'reset-yes':S=blank();save();V={tab:'today',j:null,sub:'log',ob:0,confirm:false};render(true);return;
    case 'ob-next':V.ob=Math.min(3,V.ob+1);render(true);return;
    case 'ob-back':V.ob=Math.max(0,V.ob-1);render(true);return;
    case 'ob-finish':
      S.onboarded=true;if(S.periods.length)S.periods.sort();V.tab='today';
      toast('Welcome'+(S.name?', '+S.name:'')+'. Your mosaic is ready');save();render(true);return;
  }
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  var a=b.dataset.a;
  if(a==='jtog'&&!S.onboarded){var v=b.dataset.v,i=S.journeys.indexOf(v);if(i>-1)S.journeys.splice(i,1);else S.journeys.push(v);
    S.journeys.sort(function(x,y){return JIDS.indexOf(x)-JIDS.indexOf(y);});save();render();return;}
  act(a,b);
});
document.addEventListener('input',function(e){
  var t=e.target,k=t.dataset&&t.dataset.i;if(!k)return;
  if(k==='name')S.name=t.value.trim();
  else if(k==='kidname')S.kid.name=t.value.trim();
  else if(k==='kidage')S.kid.age=Math.max(1,Math.min(12,Number(t.value)||4));
  else if(k==='pdate'&&t.value&&t.value<=today()){S.periods=[t.value];}
  save();
});

/* ---------- Start ---------- */
if(S.demo&&S.onboarded){checkBadges();}
render(true);
})();
</script>

</body></html>
